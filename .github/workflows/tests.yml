name: Verify Python Streamlit app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py planner.py resources.py nexos.py tests
      - name: Start Streamlit and smoke-test health endpoint
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/macon-wayfinder.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/macon-wayfinder.log
          exit 1
